[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-system"
version = "0.9.0"
description = "Система банківських рахунків для лабораторних робіт №1–9"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
    "tests/integration/test_bank_persistence.py",
    "tests/test_api.py",
    "tests/unit/test_performance_lab9.py"
]
asyncio_mode = "strict"
markers = [
    "integration: mark test as integration test",
]

[tool.coverage.run]
source = ["bank_system"]
omit = [
    "src/bank_system/data.py",
    "src/bank_system/decorators.py",
    "src/bank_system/streaming.py",
    "src/bank_system/processors.py",
    "src/bank_system/analytics.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == '__main__':",
    "raise NotImplementedError",
]
fail_under = 50

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "bank_system.data"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bank_system.decorators"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bank_system.streaming"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bank_system.processors"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bank_system.analytics"
ignore_errors = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true